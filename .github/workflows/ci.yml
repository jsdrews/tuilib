# GitHub Actions CI for tuilib.
#
# On every push / PR: build, vet, test.
# On push to main (typically a merged PR): auto-tag the commit with the
# next semver and publish a GitHub release whose notes are generated from
# the PRs merged since the previous tag (grouped by label per
# .github/release.yml):
#   - patch bump if the commit message (which includes the PR title and,
#     for default merge commits, the source branch name) matches
#     /\b(bug|bugfix|fix)\b/i
#   - minor bump otherwise
#   - starts at v0.1.0 if no tags exist
# Tags are emitted as vX.Y.Z (Go's module system requires the "v" prefix
# for `go get`). Pre-existing bare-semver tags are still considered when
# computing the next version.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag and release
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git config user.email "github-actions@github.com"
          git config user.name "github-actions"
          git fetch --tags --force
          # Consider both v-prefixed and legacy bare-semver tags when
          # picking the previous version. --sort=-v:refname ignores a
          # leading 'v', so the comparison is apples-to-apples.
          LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)
          if [ -z "$LATEST" ]; then
            NEXT="v0.1.0"
            BUMP="initial"
          else
            VERSION=${LATEST#v}
            MAJOR=${VERSION%%.*}
            REST=${VERSION#*.}
            MINOR=${REST%%.*}
            PATCH=${REST#*.}
            if echo "$COMMIT_MSG" | grep -Eiq '\b(bug|bugfix|fix)\b'; then
              PATCH=$((PATCH + 1))
              BUMP="patch"
            else
              MINOR=$((MINOR + 1))
              PATCH=0
              BUMP="minor"
            fi
            NEXT="v${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "Previous: ${LATEST:-<none>}  Bump: $BUMP  Next: $NEXT"
          git tag -a "$NEXT" -m "Release $NEXT"
          git push origin "$NEXT"
          gh release create "$NEXT" \
            --title "$NEXT" \
            --generate-notes
