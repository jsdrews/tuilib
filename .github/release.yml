# Configures the automatic changelog GitHub builds when a release is
# published with --generate-notes. PRs merged since the previous tag are
# grouped into the categories below based on their labels; PRs without a
# matching label fall into "Other Changes" via the "*" catch-all.
#
# Add labels to PRs (feature, bugfix, docs, …) to control which section
# the entry lands in.

changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Bug Fixes
      labels:
        - bug
        - bugfix
        - fix
    - title: Documentation
      labels:
        - docs
        - documentation
    - title: Refactor & Internals
      labels:
        - refactor
        - chore
    - title: Other Changes
      labels:
        - "*"
